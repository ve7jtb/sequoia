[package]
name = "sequoia-pqmail-piv"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "LGPL-2.0-or-later"
description = "Experimental Level 3 OpenPGP adapter for PQ Mail's YubiKey 6 PIV PKCS#11 backend"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
rpassword = "7"
sequoia-openpgp = { path = "../openpgp", default-features = false, features = ["crypto-openssl", "compression-deflate"] }
sha3 = "0.10"
zeroize = "1"
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
openssl = "0.10.81"
ossl = { version = "1.5.3", default-features = false, features = ["openssl-sys", "rfc9580"] }

[dev-dependencies]
tempfile = "3"
