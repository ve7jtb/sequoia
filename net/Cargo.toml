[package]
name = "sequoia-net"
description = "Network services for OpenPGP"
version = "0.31.0"
authors = [
    "Justus Winter <justus@sequoia-pgp.org>",
    "Kai Michaelis <kai@sequoia-pgp.org>",
    "Neal H. Walfield <neal@sequoia-pgp.org>",
]
documentation = "https://docs.rs/sequoia-net"
homepage = "https://sequoia-pgp.org/"
repository = "https://gitlab.com/sequoia-pgp/sequoia"
readme = "README.md"
keywords = ["cryptography", "openpgp", "pgp", "hkp", "keyserver"]
categories = ["cryptography", "authentication", "email"]
license = "LGPL-2.0-or-later"
edition = "2021"
rust-version.workspace = true

[badges]
gitlab = { repository = "sequoia-pgp/sequoia" }
maintenance = { status = "actively-developed" }

[features]
default = ["reqwest"]
dane-client = ["dep:hickory-resolver"]
reqwest = ["dep:reqwest"]
isahc = ["dep:isahc"]

[dependencies]
sequoia-openpgp = { version = "2", path = "../openpgp", default-features = false }

anyhow = "1.0.18"
http = "1"
percent-encoding = "2.1"
reqwest = { version = "0.13", optional = true }
isahc = { version = "2.0.1", optional = true }
thiserror = ">=1, <3"
url = "2.1"
z-base-32 = "0.1.2"
base64 = ">= 0.21, < 0.23"

hickory-resolver = { version = "0.26", features = ["dnssec-aws-lc-rs"], optional = true }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = [ "server" ] }
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.13", features = ["socks"] }
tempfile = "3.1"
tokio = { version = "1.13.1", features = ["macros" , "rt-multi-thread"] }

[lib]
bench = false

[[example]]
name = "dane-get"
path = "examples/dane-get.rs"
required-features = ["dane-client"]

[[example]]
name = "hkp-get"
path = "examples/hkp-get.rs"
required-features = ["reqwest"]

[[example]]
name = "tor-hkp-get"
path = "examples/tor-hkp-get.rs"
required-features = ["reqwest"]

# Enables a crypto backend for the tests:
[target.'cfg(not(windows))'.dev-dependencies]
sequoia-openpgp = { version = "2", path = "../openpgp", default-features = false, features = ["crypto-nettle", "__implicit-crypto-backend-for-tests"] }

# Enables a crypto backend for the tests:
[target.'cfg(windows)'.dev-dependencies]
sequoia-openpgp = { version = "2", path = "../openpgp", default-features = false, features = ["crypto-cng", "__implicit-crypto-backend-for-tests"] }

[lints]
workspace = true

# Enables a crypto backend for the docs.rs generation:
[package.metadata.docs.rs]
features = ["sequoia-openpgp/default"]
