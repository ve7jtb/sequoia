[package]
name = "sequoia-openpgp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1"
libfuzzer-sys = "0.4"

[dependencies.sequoia-openpgp]
path = ".."
default-features = false
features = ["crypto-fuzzing", "allow-experimental-crypto", "allow-variable-time-crypto"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "cert-from-bytes"
path = "fuzz_targets/cert_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "inline-verify-from-bytes"
path = "fuzz_targets/inline_verify_from_bytes.rs"

[[bin]]
name = "csf-verify-from-bytes"
path = "fuzz_targets/csf_verify_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "decrypt-from-bytes"
path = "fuzz_targets/decrypt_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "key-packet-from-bytes"
path = "fuzz_targets/key_packet_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "rawcert-from-bytes"
path = "fuzz_targets/rawcert_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "cert-parser-binary-from-bytes"
path = "fuzz_targets/cert_parser_binary_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "cert-parser-from-bytes"
path = "fuzz_targets/cert_parser_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "message-from-bytes"
path = "fuzz_targets/message_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "packet-pile-from-bytes"
path = "fuzz_targets/packet_pile_from_bytes.rs"
test = false
doc = false
